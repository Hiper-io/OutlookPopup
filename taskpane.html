<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Details</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
      body { font-family: Segoe UI, Arial, sans-serif; margin: 0; padding: 16px; color: #201f1e; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.sub { font-size: 12px; color: #605e5c; margin: 0 0 16px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
      select, input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px;
        border: 1px solid #8a8886; border-radius: 2px; }
      button { margin-top: 18px; width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
        color: #fff; background: #0f6ebe; border: none; border-radius: 2px; cursor: pointer; }
      button:hover { background: #0c5a9c; }
      #status { margin-top: 14px; font-size: 13px; min-height: 18px; }
      #status.ok { color: #107c10; }
      #status.err { color: #a4262c; }
    </style>
  </head>
  <body>
    <h1>Meeting details</h1>
    <p class="sub">Set these before sending. The meeting can't be sent without them.</p>

    <label for="job">Job number</label>
    <input id="job" type="text" placeholder="e.g. J1234" autocomplete="off" />

    <label for="purpose">What is this meeting for?</label>
    <select id="purpose">
      <option value="">— choose —</option>
    </select>

    <button id="apply" type="button">Save to meeting</button>
    <div id="status"></div>

    <script type="text/javascript" src="taskpane.js"></script>
  </body>
</html>
